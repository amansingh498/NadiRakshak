version: "cpcb_designated_best_use_v1"
last_verified: "2026-03-01"
source: "Central Pollution Control Board (CPCB) - Water Quality Criteria (Class B: Outdoor Bathing)"
url: "https://cpcb.nic.in/water-quality-criteria/"

parameters:
  ph:
    min: 6.5
    max: 8.5
    weight: 0.15
    unit: "pH units"
    ideal_min: 7.0
    ideal_max: 7.8
    description: "Measure of acidity or alkalinity"

  do_mgl:
    min: 5.0
    weight: 0.30
    unit: "mg/L"
    ideal_min: 7.0
    description: "Dissolved Oxygen (higher is better, minimum 5 mg/L for outdoor bathing)"

  bod_mgl:
    max: 3.0
    weight: 0.30
    unit: "mg/L"
    ideal_max: 2.0
    critical_threshold: 10.0
    description: "Biochemical Oxygen Demand (3 days, 27°C, lower is better, max 3 mg/L for bathing)"

  turbidity_ntu:
    max: 10.0
    weight: 0.10
    unit: "NTU"
    ideal_max: 5.0
    description: "Water clarity indicator"

  fecal_coliform:
    max_desirable: 500
    max_permissible: 2500
    weight: 0.15
    unit: "MPN/100 mL"
    ideal_max: 100
    critical_threshold: 10000
    description: "Microbial contamination indicator (fecal coliform count)"

health_bands:
  - band: "Excellent"
    range: [80, 100]
    color: "#10b981"
    bg_color: "#ecfdf5"
    description: "Pristine to near-pristine water quality. Fully meets outdoor bathing criteria."
  - band: "Good"
    range: [60, 79]
    color: "#3b82f6"
    bg_color: "#eff6ff"
    description: "Acceptable water quality with minor deviations. Suitable for designated uses."
  - band: "Moderate"
    range: [40, 59]
    color: "#f59e0b"
    bg_color: "#fffbeb"
    description: "Stressed water body. Significant contamination requiring targeted intervention."
  - band: "Poor"
    range: [20, 39]
    color: "#f97316"
    bg_color: "#fff7ed"
    description: "Highly polluted. DO depleted, high organic load; unsafe for bathing."
  - band: "Critical"
    range: [0, 19]
    color: "#ef4444"
    bg_color: "#fef2f2"
    description: "Ecologically dead or septic zone. Heavy industrial/untreated sewage discharge."

evidence_scoring:
  river_buffer_meters: 500
  recent_photo_max_hours: 24
  duplicate_phash_threshold: 5
  clustering_distance_meters: 1000
  clustering_window_hours: 48

sla_hours:
  REPORTED: 24
  TRIAGED: 48
  VERIFIED: 72
  ASSIGNED: 96
  UNDER_INVESTIGATION: 168
  ACTION_TAKEN: 72
